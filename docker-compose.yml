services:
  # Труба для звука: self-hosted LiveKit-сервер в dev-режиме.
  livekit:
    image: livekit/livekit-server:latest
    command: --bind 0.0.0.0
    ports:
      - "7880:7880"       # WebSocket / API
      - "7881:7881"       # WebRTC (TCP)
      - "7882:7882/udp"   # WebRTC (UDP)
    environment:
      LIVEKIT_KEYS: "devkey: secret"
    logging:
      driver: none

  # Голосовой бот (воркер). Подключается к сервису livekit по docker-сети.
  agent:
    build: .
    depends_on:
      - livekit
    environment:
      # LiveKit: адрес сервиса ВНУТРИ docker-сети (не localhost!).
      LIVEKIT_URL: "ws://livekit:7880"
      LIVEKIT_API_KEY: "devkey"
      LIVEKIT_API_SECRET: "secret"
      # Ключи ИИ подставляются из твоего .env (см. .env.example).
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      ELEVENLABS_API_KEY: "${ELEVENLABS_API_KEY}"
      ELEVENLABS_VOICE_ID: "${ELEVENLABS_VOICE_ID}"
      # SOCKS5-прокси из .env (нужен, если ElevenLabs/OpenAI режут по региону).
      PROXY_HOST: "${PROXY_HOST}"
      PROXY_PORT: "${PROXY_PORT}"
      PROXY_USER: "${PROXY_USER}"
      PROXY_PASS: "${PROXY_PASS}"
      # Громкость фона (можно крутить в .env без правки кода).
      BG_ENABLED: "${BG_ENABLED:-true}"
      BG_AMBIENT_VOLUME: "${BG_AMBIENT_VOLUME:-0.4}"
      BG_THINKING_VOLUME: "${BG_THINKING_VOLUME:-0.6}"
      # Распознавание речи: service — локальный транскрибатор, openai — облако.
      VOICE_BOT_STT_PROVIDER: "${VOICE_BOT_STT_PROVIDER:-service}"
      VOICE_BOT_STT_SERVICE_URL: "${VOICE_BOT_STT_SERVICE_URL:-http://172.17.0.1:8137}"
      VOICE_BOT_STT_SERVICE_TIMEOUT: "${VOICE_BOT_STT_SERVICE_TIMEOUT:-15}"
      # «Мозг»: openai — облако; agent — удалённый граф LangGraph на хосте.
      VOICE_BOT_LLM_PROVIDER: "${VOICE_BOT_LLM_PROVIDER:-openai}"
      VOICE_BOT_AGENT_URL: "${VOICE_BOT_AGENT_URL:-http://172.17.0.1:8127}"
      VOICE_BOT_AGENT_GRAPH: "${VOICE_BOT_AGENT_GRAPH:-vector_agent}"
      VOICE_BOT_AGENT_TIMEOUT: "${VOICE_BOT_AGENT_TIMEOUT:-30}"
      VOICE_BOT_LOG_LEVEL: "INFO"
      # Уровень для шумных библиотек (livekit, aiohttp, openai и т.п.).
      VOICE_BOT_NOISY_LOG_LEVEL: "${VOICE_BOT_NOISY_LOG_LEVEL:-WARNING}"

    # prod-режим: воркер регистрируется на сервере и ждёт звонков.
    command: ["python", "-m", "voice_bot.agent.main", "start"]

  # Локальный веб-клиент: официальный agent-starter-react (сборка из git).
  # Сам выдаёт JWT через /api/token — ручной make token не нужен.
  playground:
    build:
      context: ./playground
    depends_on:
      - livekit
    ports:
      - "3000:3000"
    environment:
      # serverUrl уходит в браузер → localhost (не имя сервиса docker).
      LIVEKIT_URL: "ws://localhost:7880"
      LIVEKIT_API_KEY: "devkey"
      LIVEKIT_API_SECRET: "secret"
      # Пусто = автоподхват агента (как AGENT_AUTO_ACCEPT у воркера).
      AGENT_NAME: ""
      NODE_ENV: development
