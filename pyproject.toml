[project]
name = "voice-bot"
version = "0.1.0"
description = "Голосовой бот для звонков по скрипту (LiveKit + OpenAI + ElevenLabs)"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[openai,elevenlabs,silero,turn-detector]~=1.4",
    "pydantic~=2.9",
    "pydantic-settings~=2.5",
    "python-dotenv~=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff~=0.8",
    "pytest~=8.3",
    "pytest-asyncio~=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_bot"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Разумный базовый набор правил: ошибки, импорты, именование, апгрейды, багбир.
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# Кириллица в строках и докстрингах — это норма для проекта, глушим шум.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["voice_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
